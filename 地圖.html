<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>圖台</title>
    <!-- leaflet -->
    <link rel="stylesheet" href="leaflet/css/leaflet.css">
    <script src="leaflet/js/leaflet.js"></script>
    <!-- jquery -->
    <script src="jquery/jquery-3.7.0.js"></script>
    <!-- jqueryui -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>

    <!-- 字體 -->
    <link rel="stylesheet" href="MAIN.css/main.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.css"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-minimap/3.6.1/Control.MiniMap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/Falke-Design/LeafletSlider@latest/dist/leaflet.SliderControl.min.js"></script>

    <link rel="stylesheet" href="Leaflet-slider/leaflet-slider.css" />

</head>     
<body>

    <div id="headtitle">SAR衛星多時序與近即時海岸帶整合監測平台</div>
    <div id="map" style="width: 100%;"></div>

    <!-- 前人古蹟copy過來的部分 開始 -->
    <!-- Hotpoint 海岸線變化分析 Modal -->
    <div class="modal fade" id="hotpointModal" tabindex="-1" aria-labelledby="hotpointModalLabel" aria-hidden="true">
        <div class="modal-dialog">
        <div class="modal-content d-flex align-items-center justify-content-center">
            <div class="modal-header">
                <button type="button" class="btn btn-primary" id="hotpointBtn-1">104年海岸線變化分析</button>
                <button type="button" class="btn btn-primary" id="hotpointBtn-2">105年海岸線變化分析</button>
                <button type="button" class="btn btn-primary" id="hotpointBtn-3">106年海岸線變化分析</button>
                <button type="button" id="hotpointBtn-close" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
    </div>
            <div class="modal-footer">
            </div>
        </div>
        </div>
    </div>

    <!-- 歷史影像 Carousel:縣市 -->
    <div id="carousel-overlay" style="display:none"></div>
    <div id="carousel-container" style="display:none" >
        <button type="button" id="CarouselBtn-close" class="btn-close btn-close-white"  aria-label="Close"></button>
            <div class="col-xl-12">
                <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
                    <div class="slidecontainer">
                        <input type="range" min="0" max="19" value="0" class="citySlider" id="citySliderRange">
                        <datalist id="cityTickmarks"></datalist>
                        <p id="citySliderValue"><span id="cityYear"></span>年</p>
                    </div>
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img id="CityPic" src="" class="d-block w-100" ></a>
                            <div class="carousel-caption d-none d-md-block">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 歷史影像 Carousel:鄉鎮-->
    <div id="carousel-overlay" style="display:none"></div>
    <div id="carousel-container" style="display:none" >
        <button type="button" id="CarouselBtn-close" class="btn-close btn-close-white"  aria-label="Close"></button>
        <div class="col-xl-12">
            <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
                <div class="slidecontainer">
                    <input type="range" min="0" max="18" value="0" class="DistrictsSlider" id="DistrictsSliderRange">
                    <datalist id="DistrictsTickmarks"></datalist>
                    <p id="DistrictsSliderValue"><span id="DistrictsYear"></span>年</p>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img id="DistrictsPic" src="" class="d-block w-100" ></a>
                        <div class="carousel-caption d-none d-md-block">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    <!-- 前人古蹟copy過來的部分 結束 -->

    <script src="MAIN.js/main_before.js"></script>
